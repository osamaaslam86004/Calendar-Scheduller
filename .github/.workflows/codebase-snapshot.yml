name: Generate Codebase Snapshot PR

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  create-snapshot-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create branches and commits
      pull-requests: write # Needed to open and update Pull Requests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Repomix
        run: npx repomix

      - name: Create Pull Request for Snapshot
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update repomix codebase snapshot"
          title: "chore: update repomix codebase snapshot"
          body: |
            ## Repomix Codebase Snapshot Update
            This automated PR updates `repomix-output.txt` with the latest repository state.
            
            - Generated via GitHub Actions workflow
            - Configured via `repomix.config.json`
          branch: "automation/update-repomix-snapshot"
          base: "main"
          delete-branch: true
          sign-off: false