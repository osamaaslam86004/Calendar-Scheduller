# Reusable configuration block for Python apps
x-app-service: &app-service
  build: .
  env_file:
    - .env
  environment:
    DB__ASYNC_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/calendar_service
    DB__SYNC_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/calendar_service
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432" # to connect to DBeaver
    environment:
      POSTGRES_DB: calendar_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendar_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    <<: *app-service
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  celery_worker:
    <<: *app-service
    command: celery -A celery_app.celery_app worker --loglevel=info -Q calendar

volumes:
  postgres_data:
  redis_data:
