[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --tb=short
    -v
    --disable-warnings
filterwarnings =
    ignore:.*starlette\.testclient.*:DeprecationWarning
markers =
    unit: Fast, isolated unit tests with zero external dependencies.
    integration: Integration tests requiring testcontainer Redis/database services.
    e2e: End-to-End workflows exercising the HTTP routing layer.
    performance: High-concurrency stress and load tests.